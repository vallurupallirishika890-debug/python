<!DOCTYPE html>
<html>
 <head>
    <title>Align-self</title>
 <style>
     .container{
            display:flex;
            height:300px;
            background-color:lightgray;
            align-items:flex-start;
            gap:10px;
           }
    .box{
            width:100px;
            padding:20px;
            background-color:orange;
            text-align:center;
           }
    .box1{
            align-self:flex-start;
             }
     .box2{
            align-self:stretch;
            }
    .box3{
            align-self:flex-end;
            }
 </style>
 </head>
<body>
  <h2>CSS Align-self examples</h2>
 <div class="container">
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">box3</div>
 </div>
</body>
</html>
